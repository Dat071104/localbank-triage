global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: localbank-classifier
    metrics_path: /metrics
    static_configs:
      - targets: ["classifier-service:8001"]

  - job_name: localbank-urgency
    metrics_path: /metrics
    static_configs:
      - targets: ["urgency-service:8002"]

  - job_name: localbank-gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["api-gateway:8005"]

  - job_name: localbank-rag
    metrics_path: /metrics
    static_configs:
      - targets: ["rag-service:8003"]

  - job_name: localbank-llm
    metrics_path: /metrics
    static_configs:
      - targets: ["llm-service:8004"]
