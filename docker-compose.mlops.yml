services:
  minio:
    image: minio/minio:latest
    container_name: localbank-minio
    profiles: ["mlops"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-localbank}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-localbank-local-dev}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-create-bucket:
    image: minio/mc:latest
    container_name: localbank-minio-create-bucket
    profiles: ["mlops"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-localbank}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-localbank-local-dev}
      MINIO_BUCKET: ${MINIO_BUCKET:-localbank-triage-artifacts}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${MINIO_BUCKET}
      "

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.19.0
    container_name: localbank-mlflow
    profiles: ["mlops"]
    depends_on:
      minio:
        condition: service_healthy
      minio-create-bucket:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-localbank}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-localbank-local-dev}
      MLFLOW_S3_ENDPOINT_URL: ${MLFLOW_S3_ENDPOINT_URL:-http://minio:9000}
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root s3://${MINIO_BUCKET:-localbank-triage-artifacts}/
    ports:
      - "5000:5000"
    volumes:
      - mlruns_data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  minio_data:
  mlruns_data:
